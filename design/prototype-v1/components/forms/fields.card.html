<!-- @dsCard group="Components" viewport="700x260" name="Input, SearchField & SegmentToggle" subtitle="Calm text entry and the Offer / Need switch" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--canvas); color: var(--text-primary); font-family: var(--font-body); padding: 22px; }
  .lbl { font: var(--role-caption); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, SearchField, SegmentToggle } = window.ResilientSALivingSoilDesignSystem_6bdfdd;
    function Demo() {
      const [kind, setKind] = React.useState('offer');
      return (
        <div className="grid">
          <div>
            <div className="lbl">Text entry</div>
            <div style={{display:'flex', flexDirection:'column', gap:14}}>
              <Input label="What are you offering?" placeholder="e.g. Spare seedlings" />
              <SearchField />
            </div>
          </div>
          <div>
            <div className="lbl">Offer / Need switch</div>
            <SegmentToggle value={kind} onChange={setKind} options={[
              { value:'offer', label:'Offering', icon:'arrow-up', activeColor:'var(--offer)' },
              { value:'need',  label:'Needing',  icon:'arrow-down', activeColor:'var(--need)' },
            ]} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
