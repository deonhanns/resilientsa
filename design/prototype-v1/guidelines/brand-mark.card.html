<!-- @dsCard group="Brand" viewport="700x220" name="The mark — seed in hand" subtitle="Living Soil. A hand cradling a germinating seed with roots reaching down." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); color: var(--text-primary); font-family: var(--font-body); padding: 0; }
  .wrap { display: flex; height: 220px; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .panel img { width: 96px; height: 96px; }
  .light { background: var(--canvas); }
  .dark { background: var(--bark-900); }
  .name { font: var(--role-heading); font-size: 22px; }
  .name.on { color: var(--canvas); }
  .cap { font: var(--role-caption); color: var(--text-muted); }
  .cap.on { color: var(--bark-200); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light">
      <img src="../assets/logo/resa-mark.svg" alt="ResilientSA mark">
      <div class="name">ResilientSA</div>
      <div class="cap">On Canvas Grey</div>
    </div>
    <div class="panel dark">
      <img src="../assets/logo/resa-mark.svg" alt="ResilientSA mark">
      <div class="name on">ResilientSA</div>
      <div class="cap on">On Baobab Bark</div>
    </div>
  </div>
</body>
</html>
