<!-- @dsCard group="Type" viewport="700x200" name="Ubuntu — headings" subtitle="All headings. Warm, humanist, grounded." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); color: var(--text-primary); font-family: var(--font-body); padding: 22px; }
  .disp { font: var(--role-display); margin: 0 0 6px; }
  .title { font: var(--role-title); margin: 0 0 6px; }
  .head { font: var(--role-heading); margin: 0; }
  .tag { font: var(--role-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .line { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="line"><span class="disp">Grow together</span><span class="tag">Ubuntu Bold · 38</span></div>
  <div class="line"><span class="title">A hand knows a hand</span><span class="tag">Ubuntu Medium · 24</span></div>
  <div class="line"><span class="head">What does your cell need?</span><span class="tag">Ubuntu Medium · 20</span></div>
</body>
</html>
