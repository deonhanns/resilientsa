<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>

</style>
</head>
<body>
  <div class="row">
    <span class="s" style="font-size:38px">Aa<span class="n">38</span></span>

    <span class="s" style="font-size:20px">Aa<span class="n">20</span></span>
    <span class="s" style="font-size:18px">Aa<span class="n">18</span></span>
    <span class="s" style="font-size:16px">Aa<span class="n">16</span></span>
    <span class="s" style="font-size:14px">Aa<span class="n">14</span></span>
    <span class="s" style="font-size:12px">Aa<span class="n">12</span></span>
    <span class="s" style="font-size:11px">Aa<span class="n">11</span></span>

</body>
</html>
