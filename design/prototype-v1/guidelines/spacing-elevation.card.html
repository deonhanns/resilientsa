<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & elevation" subtitle="Friendly corners, low warm shadows" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); color: var(--text-primary); font-family: var(--font-body); padding: 22px; }
  .wrap { display: flex; gap: 32px; align-items: center; }
  .grp { display: flex; gap: 14px; align-items: flex-end; }
  .box { width: 64px; height: 64px; background: var(--surface-card); border: 1px solid var(--border-hairline); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .n { font: var(--role-caption); color: var(--text-muted); }
  .hd { font: var(--role-caption); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="hd">Corner radii</div>
      <div class="grp">
        <div class="box" style="border-radius:var(--radius-sm)"><span class="n">8</span></div>
        <div class="box" style="border-radius:var(--radius-md)"><span class="n">12</span></div>
        <div class="box" style="border-radius:var(--radius-lg)"><span class="n">16</span></div>
        <div class="box" style="border-radius:var(--radius-xl)"><span class="n">22</span></div>
        <div class="box" style="border-radius:var(--radius-pill)"><span class="n">pill</span></div>
      </div>
    </div>
    <div>
      <div class="hd">Elevation</div>
      <div class="grp">
        <div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-flat);border:none"><span class="n">flat</span></div>
        <div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-card);border:none"><span class="n">card</span></div>
        <div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-raised);border:none"><span class="n">raised</span></div>
      </div>
    </div>
  </div>
</body>
</html>
