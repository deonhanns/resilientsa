<!-- @dsCard group="Colors" viewport="700x180" name="Foundation neutrals" subtitle="Baobab Bark on Canvas Grey — never pure black or white" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); color: var(--text-primary); font-family: var(--font-body); padding: 22px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-md); border: 1px solid var(--border-hairline); overflow: hidden; }
  .chip { height: 66px; }
  .meta { padding: 8px 10px; background: var(--surface-card); }
  .nm { font: var(--role-label); }
  .hx { font: var(--role-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#2C2A29"></div><div class="meta"><div class="nm">Baobab Bark</div><div class="hx">#2C2A29 · text & line</div></div></div>
    <div class="sw"><div class="chip" style="background:#5C5854"></div><div class="meta"><div class="nm">Bark 600</div><div class="hx">#5C5854 · secondary</div></div></div>
    <div class="sw"><div class="chip" style="background:#8A857F"></div><div class="meta"><div class="nm">Bark 400</div><div class="hx">#8A857F · muted</div></div></div>
    <div class="sw"><div class="chip" style="background:#F4F4F2"></div><div class="meta"><div class="nm">Canvas Grey</div><div class="hx">#F4F4F2 · page</div></div></div>
  </div>
</body>
</html>
